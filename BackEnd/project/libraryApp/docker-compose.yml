services:
  mongodb:
    image: mongo:8.2
    container_name: libraryApp-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: Library_V1
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }\" > /dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  app:
    build: .
    container_name: libraryApp-app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      DB_URL: mongodb://mongodb:27017/Library?replicaSet=rs0
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  mongodb_data:
