<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content=" الكتب — متجر الكتب ومكتبة الإدارة" />
    <title>الكتب • Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ================= NAV ================= -->
    <header class="topbar">
      <div class="brand" data-view="store">📚 الكتب</div>
      <nav class="main-nav">
        <a class="nav-link" data-view="store">المتجر</a>
        <a class="nav-link hidden" id="nav-dashboard" data-view="dashboard"
          >لوحة التحكم</a
        >
        <a class="nav-link hidden" id="nav-orders" data-view="orders">طلباتي</a>
        <a class="nav-link hidden" id="nav-profile" data-view="profile"
          >حسابي</a
        >
      </nav>
      <div class="top-actions">
        <button class="btn ghost" id="btn-cart">
          🛒 <span id="cart-count">0</span>
        </button>
        <div id="auth-area">
          <button class="btn primary" id="btn-login">تسجيل الدخول</button>
        </div>
      </div>
    </header>

    <main>
      <!-- ================= STORE ================= -->
      <section class="view active" id="view-store">
        <div class="store-controls">
          <input
            id="search-input"
            type="search"
            placeholder="ابحث عن كتاب..."
          />
          <select id="sort-select">
            <option value="">بدون ترتيب</option>
            <option value="price">السعر (تصاعدي)</option>
            <option value="-price">السعر (تنازلي)</option>
          </select>
          <input id="publisher-filter" type="text" placeholder="ناشر..." />
          <div id="category-filters" class="chips"></div>
        </div>
        <div id="books-grid" class="books-grid"></div>
        <button
          class="btn ghost"
          id="books-loadmore"
          style="display: none; margin: 18px auto"
        >
          تحميل المزيد
        </button>
      </section>

      <!-- ================= CART ================= -->
      <section class="view" id="view-cart">
        <h2>سلة المشتريات</h2>
        <div id="cart-items" class="cart-items"></div>
        <div id="cart-summary" class="cart-summary hidden">
          <div><strong>الإجمالي:</strong> <span id="cart-total">0</span></div>
          <div id="customer-fields" class="hidden">
            <input id="cust-name" placeholder="اسم العميل" />
            <input id="cust-phone" placeholder="تليفون العميل" />
            <input id="cust-address" placeholder="عنوان العميل" />
            <select id="cust-gender">
              <option value="male">ذكر</option>
              <option value="female">أنثى</option>
            </select>
            <select id="cust-type">
              <option value="branch">فرع</option>
              <option value="online">أونلاين</option>
              <option value="onlineAndBranch">فرع وأونلاين</option>
            </select>
          </div>
          <div id="checkout-fields">
            <input
              id="checkout-address"
              placeholder="عنوان الشحن (للأونلاين)"
            />
            <input id="checkout-note" placeholder="ملاحظة (اختياري)" />
          </div>
          <button class="btn primary" id="btn-buy">شراء</button>
          <p id="cart-msg" class="msg"></p>
        </div>
      </section>

      <!-- ================= DASHBOARD ================= -->
      <section class="view" id="view-dashboard">
        <nav class="dash-nav" id="dash-nav">
          <a class="dash-tab active" data-dash="books">الكتب</a>
          <a class="dash-tab" data-dash="authors">المؤلفون</a>
          <a class="dash-tab" data-dash="categories">التصنيفات</a>
          <a class="dash-tab" data-dash="customers">العملاء</a>
          <a class="dash-tab" data-dash="orders">الطلبات</a>
          <a class="dash-tab" data-dash="stock">المخزون</a>
          <a class="dash-tab" data-dash="pos">نقطة البيع</a>
          <a class="dash-tab" data-dash="reports">التقارير</a>
        </nav>

        <div class="dash-pane active" id="dash-books">
          <div class="dash-head">
            <input id="dash-book-search" placeholder="بحث..." />
            <button class="btn primary" id="btn-new-book">كتاب جديد</button>
          </div>
          <div id="dash-books-list" class="dash-list"></div>
        </div>

        <div class="dash-pane" id="dash-authors">
          <div class="dash-head">
            <input id="dash-author-search" placeholder="بحث..." />
            <button class="btn primary" id="btn-new-author">مؤلف جديد</button>
          </div>
          <div id="dash-authors-list" class="dash-list"></div>
        </div>

        <div class="dash-pane" id="dash-categories">
          <div class="dash-head">
            <input id="dash-category-search" placeholder="بحث..." />
            <button class="btn primary" id="btn-new-category">
              تصنيف جديد
            </button>
          </div>
          <div id="dash-categories-list" class="dash-list"></div>
        </div>

        <div class="dash-pane" id="dash-customers">
          <div class="dash-head">
            <input id="dash-customer-search" placeholder="بحث..." />
            <select id="dash-customer-gender">
              <option value="">كل الجنس</option>
              <option value="male">ذكر</option>
              <option value="female">أنثى</option>
            </select>
            <select id="dash-customer-type">
              <option value="">كل النوع</option>
              <option value="branch">فرع</option>
              <option value="online">أونلاين</option>
              <option value="onlineAndBranch">فرع وأونلاين</option>
            </select>
          </div>
          <div id="dash-customers-list" class="dash-list"></div>
        </div>

        <div class="dash-pane" id="dash-orders">
          <div class="dash-head">
            <input id="dash-order-search" placeholder="بحث برقم الطلب..." />
            <select id="dash-order-status">
              <option value="">كل الحالات</option>
              <option value="new">جديد</option>
              <option value="in_processing">قيد التجهيز</option>
              <option value="ready_to_ship">جاهز للشحن</option>
              <option value="shipped">تم الشحن</option>
              <option value="delivered">تم التسليم</option>
              <option value="canceled">ملغي</option>
            </select>
          </div>
          <div id="dash-orders-list" class="dash-list"></div>
        </div>

        <div class="dash-pane" id="dash-stock">
          <div class="dash-head">
            <input id="dash-stock-search" placeholder="بحث..." />
          </div>
          <div id="dash-stock-list" class="dash-list"></div>
          <div id="dash-stock-detail" class="dash-stock-detail"></div>
        </div>

        <div class="dash-pane" id="dash-pos">
          <div class="dash-head">
            <input id="pos-search-input" placeholder="ابحث لإضافة منتج..." />
          </div>
          <div id="pos-results" class="pos-results"></div>
          <div id="pos-cart" class="pos-cart"></div>
          <div class="pos-checkout">
            <input id="pos-cust-name" placeholder="اسم العميل *" />
            <input id="pos-cust-phone" placeholder="تليفون العميل *" />
            <input id="pos-cust-address" placeholder="عنوان العميل" />
            <button class="btn primary" id="pos-checkout">إتمام البيع</button>
          </div>
        </div>

        <div class="dash-pane" id="dash-reports">
          <div id="reports-content"></div>
        </div>
      </section>

      <!-- ================= MY ORDERS ================= -->
      <section class="view" id="view-orders">
        <h2>طلباتي</h2>
        <div class="dash-head">
          <input id="my-order-search" placeholder="بحث..." />
          <select id="my-order-status">
            <option value="">كل الحالات</option>
            <option value="new">جديد</option>
            <option value="in_processing">قيد التجهيز</option>
            <option value="ready_to_ship">جاهز للشحن</option>
            <option value="shipped">تم الشحن</option>
            <option value="delivered">تم التسليم</option>
            <option value="canceled">ملغي</option>
          </select>
        </div>
        <div id="my-orders-list" class="dash-list"></div>
      </section>

      <!-- ================= PROFILE ================= -->
      <section class="view" id="view-profile">
        <h2>حسابي</h2>
        <form id="profile-form" class="profile-form">
          <div class="avatar-wrap">
            <img id="profile-avatar" class="avatar" alt="avatar" />
            <input id="profile-avatar-file" type="file" accept="image/*" />
          </div>
          <label>الاسم<input id="profile-username" /></label>
          <label>التليفون<input id="profile-phone" /></label>
          <label
            >الجنس<select id="profile-gender">
              <option value="male">ذكر</option>
              <option value="female">أنثى</option>
            </select></label
          >
          <label>العنوان<textarea id="profile-address"></textarea></label>
          <button class="btn primary" type="submit">حفظ</button>
          <p id="profile-msg" class="msg"></p>
        </form>
      </section>
    </main>

    <!-- ================= MODALS ================= -->
    <div class="modal hidden" id="auth-modal">
      <div class="modal-box">
        <button class="modal-close" data-close="auth-modal">×</button>
        <div class="auth-tabs">
          <button class="auth-tab active" data-auth="login">دخول</button>
          <button class="auth-tab" data-auth="register">تسجيل</button>
          <button class="auth-tab" data-auth="forgot">نسيت؟</button>
        </div>
        <form id="login-form" class="auth-form">
          <input name="email" placeholder="البريد أو التليفون" />
          <input name="password" type="password" placeholder="كلمة المرور" />
          <button class="btn primary" type="submit">دخول</button>
          <p class="msg"></p>
        </form>
        <form id="register-form" class="auth-form hidden">
          <input name="username" placeholder="الاسم" />
          <input name="email" placeholder="البريد الإلكتروني" />
          <input name="phone" placeholder="التليفون" />
          <input name="password" type="password" placeholder="كلمة المرور" />
          <input
            name="confirmationPassword"
            type="password"
            placeholder="تأكيد كلمة المرور"
          />
          <select name="gender">
            <option value="male">ذكر</option>
            <option value="female">أنثى</option>
          </select>
          <input type="hidden" name="role" value="customer" />
          <button class="btn primary" type="submit">تسجيل</button>
          <p class="msg"></p>
        </form>
        <form id="forgot-form" class="auth-form hidden">
          <input name="email" placeholder="البريد الإلكتروني" />
          <input
            name="newPassword"
            type="password"
            placeholder="كلمة المرور الجديدة"
          />
          <input
            name="confirmationNewPassword"
            type="password"
            placeholder="تأكيد كلمة المرور"
          />
          <button class="btn primary" type="submit">إرسال الرمز</button>
          <p class="msg"></p>
        </form>
      </div>
    </div>

    <div class="modal hidden" id="book-modal">
      <div class="modal-box wide">
        <button class="modal-close" data-close="book-modal">×</button>
        <div id="book-modal-body"></div>
      </div>
    </div>

    <div class="modal hidden" id="entity-modal">
      <div class="modal-box">
        <button class="modal-close" data-close="entity-modal">×</button>
        <h3 id="entity-modal-heading"></h3>
        <form id="entity-form"></form>
      </div>
    </div>

    <div class="modal hidden" id="info-modal">
      <div class="modal-box wide">
        <button class="modal-close" data-close="info-modal">×</button>
        <h3 id="info-modal-heading"></h3>
        <div id="info-modal-body"></div>
      </div>
    </div>

    <div id="toast" class="toast-container"></div>

    <script src="app.js" defer></script>
  </body>
</html>
